# Docker Compose for running multiple Hummingbot market makers
# Usage:
#   docker-compose -f docker-compose-multi.yml up -d       # Start all bots
#   docker-compose -f docker-compose-multi.yml down        # Stop all bots
#   docker attach hummingbot-btc                           # Attach to BTC bot
#   Ctrl+P then Ctrl+Q to detach without stopping

services:
  hummingbot-btc:
    container_name: hummingbot-btc
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./logs/btc:/home/hummingbot/logs
      - ./data/btc:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=btc_usd_mm.yml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    tty: true
    stdin_open: true
    network_mode: host
    restart: unless-stopped

  hummingbot-eth:
    container_name: hummingbot-eth
