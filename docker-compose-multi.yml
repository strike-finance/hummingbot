# ============================================================
# Multi-Container Setup - Separate Credentials Per Pair
# ============================================================
# Each container has its own credentials but shares the SAME image.
#
# Usage:
#   docker-compose -f docker-compose-multi.yml build    # Build once
#   docker-compose -f docker-compose-multi.yml up -d    # Start all
#   docker-compose -f docker-compose-multi.yml up -d hummingbot-sol  # Start one
# ============================================================

x-hummingbot-common: &hummingbot-common
  build:
    context: .
    dockerfile: Dockerfile
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  tty: true
  stdin_open: true
  network_mode: host
  restart: unless-stopped

services:
  hummingbot-btc:
    <<: *hummingbot-common
    container_name: hummingbot-btc
    volumes:
      - ./conf/btc/strategies:/home/hummingbot/conf/strategies
      - ./conf/btc/connectors:/home/hummingbot/conf/connectors
      - ./logs/btc:/home/hummingbot/logs
      - ./data/btc:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=btc_usd_mm.yml

  hummingbot-eth:
    <<: *hummingbot-common
    container_name: hummingbot-eth
    volumes:
      - ./conf/eth/strategies:/home/hummingbot/conf/strategies
      - ./conf/eth/connectors:/home/hummingbot/conf/connectors
      - ./logs/eth:/home/hummingbot/logs
      - ./data/eth:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=eth_usd_mm.yml

  hummingbot-sol:
    <<: *hummingbot-common
    container_name: hummingbot-sol
    volumes:
      - ./conf/sol/strategies:/home/hummingbot/conf/strategies
      - ./conf/sol/connectors:/home/hummingbot/conf/connectors
      - ./conf/sol/controllers:/home/hummingbot/conf/controllers
      - ./conf/sol/scripts:/home/hummingbot/conf/scripts
      - ./logs/sol:/home/hummingbot/logs
      - ./data/sol:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=v2_with_controllers.py
      - SCRIPT_CONFIG=sol_mm_dynamic.yml

  hummingbot-ada:
    <<: *hummingbot-common
    container_name: hummingbot-ada
    volumes:
      - ./conf/ada/strategies:/home/hummingbot/conf/strategies
      - ./conf/ada/connectors:/home/hummingbot/conf/connectors
      - ./logs/ada:/home/hummingbot/logs
      - ./data/ada:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=ada_usd_mm.yml
