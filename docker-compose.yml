# ============================================================
# Strike Perpetual Multi-Pair Market Maker
# ============================================================
# Single container running multiple trading pairs using V2 framework
#
# Quick Start:
#   docker-compose up -d          # Start bot
#   docker attach hummingbot      # Connect to bot
#   Ctrl+P, Ctrl+Q                # Detach without stopping
#
# See SETUP_GUIDE.md for full documentation
# ============================================================

services:
  hummingbot:
    container_name: hummingbot
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./conf/connectors:/home/hummingbot/conf/connectors
      - ./conf/strategies:/home/hummingbot/conf/strategies
      - ./conf/controllers:/home/hummingbot/conf/controllers
      - ./conf/scripts:/home/hummingbot/conf/scripts
      - ./logs:/home/hummingbot/logs
      - ./data:/home/hummingbot/data
      - ./certs:/home/hummingbot/certs
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      # Auto-start the multi-pair market maker
      - CONFIG_FILE_NAME=v2_with_controllers.py
      - SCRIPT_CONFIG=strike_multi_mm.yml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    tty: true
    stdin_open: true
    network_mode: host
    restart: unless-stopped

