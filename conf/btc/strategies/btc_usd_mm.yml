########################################################
###   BTC-USD Perpetual Market Making - Strike       ###
###   Price Source: Binance Perpetual Mid Price      ###
###   Capital: $10M USD                              ###
########################################################

template_version: 6
strategy: perpetual_market_making

# Exchange and market
derivative: strike_perpetual
market: BTC-USD

# Lower leverage for safety with large capital
leverage: 3
position_mode: One-way

# ============================================
# SPREAD SETTINGS
# ============================================
bid_spread: 0.08
ask_spread: 0.08
minimum_spread: -100.0

# ============================================
# ORDER SETTINGS (sized for $10M capital)
# ============================================
# Small base order near mid: 0.1 BTC (~$10k)
order_amount: 0.1

# 20 levels on each side (40 orders total)
order_levels: 20

# +0.4 BTC per level (steep curve - small near mid, large far out)
# Level sizes: 0.1, 0.5, 0.9, 1.3, 1.7, 2.1, 2.5, 2.9, 3.3, 3.7,
#              4.1, 4.5, 4.9, 5.3, 5.7, 6.1, 6.5, 6.9, 7.3, 7.7
# Total per side: ~78 BTC (~$7.8M)
# Both sides: ~$15.6M notional (with 3x leverage = ~$5.2M margin)
order_level_amount: 0.4

# 0.04% spread between levels
order_level_spread: 0.04

# ============================================
# QUICK REFRESH SETTINGS
# ============================================
order_refresh_time: 3.0
order_refresh_tolerance_pct: 0.01
filled_order_delay: 2

# ============================================
# POSITION MANAGEMENT
# ============================================
long_profit_taking_spread: 0.3
short_profit_taking_spread: 0.3
stop_loss_spread: 1.5
time_between_stop_loss_orders: 30.0
stop_loss_slippage_buffer: 0.3

# ============================================
# PRICE SOURCE
# ============================================
price_source: current_market
price_type: mid_price
price_source_derivative:
price_source_market:
price_source_custom_api:
custom_api_update_interval: 5.0

# ============================================
# ADVANCED (disabled)
# ============================================
price_ceiling: -1.0
price_floor: -1.0
order_optimization_enabled: false
ask_order_optimization_depth: 0
bid_order_optimization_depth: 0
order_override:
