# Strike Perpetual Connector Configuration for Insurance Fund
# This file configures the Strike connector for the IF account

# ===================================================================
# API Credentials
# ===================================================================

# IF Bot API Key (from backend: /admin/apikey/generate)
# Format: sk_bot_...
strike_perpetual_api_key: ""  # REQUIRED: Set your IF API key here

# IF Account ID (from backend: IF account creation)
# Format: UUID (e.g., 01234567-89ab-cdef-0123-456789abcdef)
strike_perpetual_account_id: ""  # REQUIRED: Set your IF account ID here

# ===================================================================
# API Endpoints
# ===================================================================

# Strike API Base URL
# - Production: https://api.strike.com
# - Testnet: https://testnet-api.strike.com
# - Local: http://localhost:8080
strike_perpetual_api_url: "http://localhost:8080"

# Strike WebSocket URL
# - Production: wss://ws.strike.com
# - Testnet: wss://testnet-ws.strike.com
# - Local: ws://localhost:8080
strike_perpetual_ws_url: "ws://localhost:8080"

# ===================================================================
# Network Configuration
# ===================================================================

# Use testnet (true) or mainnet (false)
strike_perpetual_use_testnet: false

# Request timeout (seconds)
strike_perpetual_request_timeout: 10

# WebSocket ping interval (seconds)
strike_perpetual_ws_ping_interval: 30

# ===================================================================
# Trading Pairs
# ===================================================================

# List of trading pairs to monitor
# The IF unwinder will auto-discover positions, but listing here
# ensures market data is subscribed
strike_perpetual_trading_pairs:
  - ADA-USD
  - BTC-USD
  # Add more pairs as needed

# ===================================================================
# Rate Limiting
# ===================================================================

# Maximum requests per second
strike_perpetual_rate_limit_per_second: 10

# Burst allowance
strike_perpetual_rate_limit_burst: 20

# ===================================================================
# Advanced Settings
# ===================================================================

# Enable debug logging
strike_perpetual_debug_logging: false

# Order update polling interval (seconds)
# How often to poll for order updates if WebSocket is down
strike_perpetual_order_update_interval: 2

# Position update polling interval (seconds)
strike_perpetual_position_update_interval: 5

# Balance update polling interval (seconds)
strike_perpetual_balance_update_interval: 10

# ===================================================================
# SETUP INSTRUCTIONS
# ===================================================================

# 1. Create IF account via admin API:
#    curl -X POST http://localhost:8080/admin/account/create \
#      -H "X-API-Key: $ADMIN_API_KEY" \
#      -d '{"account_id":"<uuid>","type":"if","initial_balance":"500000"}'
#
# 2. Generate IF bot API key:
#    curl -X POST http://localhost:8080/admin/apikey/generate \
#      -H "X-API-Key: $ADMIN_API_KEY" \
#      -d '{"account_id":"<if-account-id>","name":"IF Bot","type":"bot"}'
#
# 3. Set credentials above:
#    strike_perpetual_api_key: "sk_bot_..."
#    strike_perpetual_account_id: "01234..."
#
# 4. Update backend config with IF account ID:
#    Edit services/engines/config/config.toml:
#    [engine.insurance_fund]
#    account_id = "<if-account-id>"
#
# 5. Restart backend engine to load IF config
#
# 6. Test connection:
#    >>> connect strike_perpetual
#    >>> balance
#
# 7. Start IF unwinder:
#    >>> start --script insurance_fund_unwinder.py

# ===================================================================
# Environment Variables (Alternative to YAML)
# ===================================================================

# You can also set credentials via environment variables:
#
# export STRIKE_PERPETUAL_API_KEY="sk_bot_..."
# export STRIKE_PERPETUAL_ACCOUNT_ID="01234..."
# export STRIKE_API_URL="http://localhost:8080"
# export STRIKE_WS_URL="ws://localhost:8080"
#
# Environment variables take precedence over this file
