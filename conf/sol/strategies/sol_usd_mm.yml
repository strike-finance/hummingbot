########################################################
###   SOL-USD Perpetual Market Making - Strike       ###
###   Price Source: Binance Perpetual Mid Price      ###
###   Capital: $10M USD                              ###
########################################################

template_version: 6
strategy: perpetual_market_making

# Exchange and market
derivative: strike_perpetual
market: SOL-USD

# Lower leverage for safety with large capital
leverage: 3
position_mode: One-way

# ============================================
# SPREAD SETTINGS
# ============================================
bid_spread: 0.04
ask_spread: 0.04
minimum_spread: 0.02

# ============================================
# ORDER SETTINGS (tiny near mid, large far out)
# ============================================
# Tiny base order near mid: 1 SOL (~$225)
order_amount: 1

# 25 levels on each side (50 orders total)
order_levels: 25

# +20 SOL per level
# Level 1: 1, Level 5: 81, Level 10: 181, Level 20: 381
order_level_amount: 20

# 0.08% spread between levels
order_level_spread: 0.08

# ============================================
# STABLE REFRESH SETTINGS (less churn)
# ============================================
order_refresh_time: 20.0
order_refresh_tolerance_pct: 0.5
filled_order_delay: 1

# ============================================
# POSITION MANAGEMENT
# ============================================
# Continue placing opening orders while holding a position
continuous_quoting: True
long_profit_taking_spread: 0.3
short_profit_taking_spread: 0.3
stop_loss_spread: 1.5
time_between_stop_loss_orders: 30.0
stop_loss_slippage_buffer: 0.3

# ============================================
# PRICE SOURCE - Strike Orderbook (Binance snapshot)
# ============================================
price_source: current_market
price_type: mid_price
price_source_derivative:
price_source_market:
price_source_custom_api:
custom_api_update_interval: 5.0

# ============================================
# ADVANCED (disabled)
# ============================================
price_ceiling: -1.0
price_floor: -1.0
order_optimization_enabled: False
ask_order_optimization_depth: 0
bid_order_optimization_depth: 0
order_override:
