########################################################
###   SOL-USD Perpetual Market Making - Strike       ###
###   Price Source: Binance Perpetual Mid Price      ###
###   Capital: $10M USD                              ###
########################################################

template_version: 6
strategy: perpetual_market_making

# Exchange and market
derivative: strike_perpetual
market: SOL-USD

# Lower leverage for safety with large capital
leverage: 3
position_mode: One-way

# ============================================
# SPREAD SETTINGS
# ============================================
bid_spread: 0.04
ask_spread: 0.04
minimum_spread: 0.02

# ============================================
# ORDER SETTINGS (sized for $10M capital)
# ============================================
# Small base order near mid: 50 SOL (~$11.25k)
order_amount: 50

# 20 levels on each side (40 orders total)
order_levels: 20

# +200 SOL per level (steep curve - small near mid, large far out)
# Level sizes: 50, 250, 450, 650, 850, 1050, 1250, 1450, 1650, 1850,
#              2050, 2250, 2450, 2650, 2850, 3050, 3250, 3450, 3650, 3850
# Total per side: ~39,000 SOL (~$8.8M)
# Both sides: ~$17.6M notional (with 3x leverage = ~$5.9M margin)
order_level_amount: 200

# 0.1% spread between levels (wider distribution)
order_level_spread: 0.1

# ============================================
# QUICK REFRESH SETTINGS
# ============================================
order_refresh_time: 3.0
order_refresh_tolerance_pct: 0.01
filled_order_delay: 2

# ============================================
# POSITION MANAGEMENT
# ============================================
# Continue placing opening orders while holding a position
continuous_quoting: true
long_profit_taking_spread: 0.3
short_profit_taking_spread: 0.3
stop_loss_spread: 1.5
time_between_stop_loss_orders: 30.0
stop_loss_slippage_buffer: 0.3

# ============================================
# PRICE SOURCE - Anchored to Binance Perpetual
# ============================================
price_source: external_market
price_type: mid_price
price_source_derivative: binance_perpetual
price_source_market: SOL-USDT
price_source_custom_api:
custom_api_update_interval: 5.0

# ============================================
# ADVANCED (disabled)
# ============================================
price_ceiling: -1.0
price_floor: -1.0
order_optimization_enabled: false
ask_order_optimization_depth: 0
bid_order_optimization_depth: 0
order_override:
