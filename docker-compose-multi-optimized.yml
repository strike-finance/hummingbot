# Optimized Docker Compose for multiple Hummingbot bots
# 
# IMPORTANT: Build the image ONCE before running:
#   docker build -t hummingbot:latest .
#
# Usage:
#   docker-compose -f docker-compose-multi-optimized.yml up -d
#   docker-compose -f docker-compose-multi-optimized.yml down
#   docker attach hummingbot-btc

# Common settings template (YAML anchor)
x-hummingbot-common: &hummingbot-common
  image: hummingbot:latest  # Use pre-built image instead of building each time
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  tty: true
  stdin_open: true
  network_mode: host
  restart: unless-stopped

services:
  hummingbot-btc:
    <<: *hummingbot-common
    container_name: hummingbot-btc
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./logs/btc:/home/hummingbot/logs
      - ./data/btc:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=btc_usd_mm.yml

  hummingbot-eth:
    <<: *hummingbot-common
    container_name: hummingbot-eth
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./logs/eth:/home/hummingbot/logs
      - ./data/eth:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=eth_usd_mm.yml

  hummingbot-sol:
    <<: *hummingbot-common
    container_name: hummingbot-sol
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./logs/sol:/home/hummingbot/logs
      - ./data/sol:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=sol_usd_mm.yml

  hummingbot-ada:
    <<: *hummingbot-common
    container_name: hummingbot-ada
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./logs/ada:/home/hummingbot/logs
      - ./data/ada:/home/hummingbot/data
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    environment:
      - CONFIG_FILE_NAME=ada_usd_mm.yml

